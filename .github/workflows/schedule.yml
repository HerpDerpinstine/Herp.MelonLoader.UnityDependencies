name: Schedule

on:
  schedule:
    - cron: '20 */12 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  fetchdeps:
    name: Fetch Dependencies
    uses: ./.github/workflows/runner.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      UPDATE_EXISTING: false
